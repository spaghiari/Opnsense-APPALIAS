[start]
command:/usr/local/etc/rc.d/appaliasd start
parameters:
type:script
message:démarrage du relais appaliasd

[stop]
command:/usr/local/etc/rc.d/appaliasd onestop
parameters:
type:script
message:arrêt du relais appaliasd

[restart]
command:/usr/local/etc/rc.d/appaliasd restart
parameters:
type:script
message:redémarrage du relais appaliasd

[status]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/status.py
parameters:
type:script_output
message:état d'appalias

[export]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/export_config.php
parameters:
type:script
message:export de la configuration appalias

[sync]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/sync_aliases.php
parameters:
type:script
message:synchronisation des alias appalias

[reload]
command:/usr/local/etc/rc.d/appaliasd onereload
parameters:
type:script
message:rechargement du relais appaliasd (SIGHUP)

[table_show]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/status.py --show
parameters:%s
type:script_output
message:affichage de la table appalias %s

[catalog_info]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/catalog.py info
parameters:
type:script_output
message:état du catalogue v2fly appalias

[catalog_search]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/catalog.py search
parameters:%s
type:script_output
message:recherche dans le catalogue v2fly appalias

[catalog_preview]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/catalog.py preview
parameters:%s
type:script_output
message:aperçu d'une liste du catalogue v2fly appalias

[catalog_resolve]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/catalog.py resolve
parameters:%s
type:script_output
message:résolution de listes du catalogue v2fly appalias

[catalog_popular]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/catalog.py popular
parameters:
type:script_output
message:galerie des applications populaires du catalogue v2fly appalias

[unbound]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/unbound_forward.py --apply
parameters:
type:script
message:branchement d'Unbound sur le relais appalias

[unbound_status]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/unbound_forward.py --status
parameters:
type:script_output
message:état du branchement d'Unbound appalias

[unbound_write]
command:/usr/local/opnsense/scripts/OPNsense/AppAlias/unbound_forward.py
parameters:
type:script
message:écriture des zones Unbound appalias (sans redémarrage)
